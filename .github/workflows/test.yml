name: tests

on:
  workflow_dispatch: # allows manual triggering
    inputs:
      nixpkgs:
        description: "nixpkgs for the e2e tests: the locked one, or current nixos-unstable"
        type: choice
        options: [pinned, unstable]
        default: pinned
  push:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/**"
    branches:
      - main
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/**"
  # Weekly run against the current nixos-unstable, which PR runs no longer use
  schedule:
    - cron: "0 4 * * 1"

jobs:
  ci-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Hestia reads the cache list through the Actions API
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/determinate-nix-action@v3

      # Caches the store paths the job builds that cache.nixos.org doesn't have
      - uses: Mic92/hestia@v3.1.0
        with:
          # Keep equal to the uses: tag; Dependabot bumps only that one
          version: v3.1.0
          upstream-cache-filter: true
          # Builds against current nixos-unstable must not fill the cache
          read-only: ${{ github.event_name == 'schedule' || inputs.nixpkgs == 'unstable' }}

      # The e2e test flakes follow clj-nix's nixpkgs, so this moves them too
      - name: Use current nixos-unstable (weekly or on request)
        if: github.event_name == 'schedule' || inputs.nixpkgs == 'unstable'
        run: nix flake update nixpkgs

      - name: Lint
        run: |
          nix develop --command lint

      - name: Evaluate the flake on every system
        run: |
          nix flake check --no-build --all-systems

      - name: Unit and integration tests (sandboxed flake checks)
        run: |
          nix flake check -L

      - name: Network tests
        run: |
          nix develop --command tests-network

      - name: End-to-end tests
        run: |
          nix develop --command tests-e2e
          echo "Derivations:"
          cat "/tmp/.cljnix-derivations"
