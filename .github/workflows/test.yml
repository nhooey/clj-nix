name: tests

on:
  workflow_dispatch: # allows manual triggering
  push:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/**"
    branches:
      - main
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/**"

jobs:
  ci-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/determinate-nix-action@v3

      - name: Lint
        run: |
          nix develop --command lint

      - name: Unit and integration tests (sandboxed flake checks)
        run: |
          nix flake check -L

      - name: Network tests
        run: |
          nix develop --command tests-network

      - name: End-to-end tests
        run: |
          nix develop --command tests-e2e
          echo "Derivations:"
          cat "/tmp/.cljnix-derivations"
